# HelixCode auto-boot infrastructure (§11.4.76 on-demand-infra).
# Booted automatically by the helixcode server on startup when
# HELIX_AUTOBOOT_INFRA is unset or true. Uses DEDICATED host ports
# (Postgres 55432, Redis 56379) that deliberately AVOID the conventional
# 5432/6379 so it never collides with — or latches the idempotent health
# pre-check onto — a host-native Postgres or Redis. Credentials match the
# helixcode default config (user=helix, db=helixcode_prod). No-password
# Redis matches the empty default HELIX_REDIS_PASSWORD.
services:
  postgres:
    image: docker.io/library/postgres:15
    container_name: helixcode-autoboot-postgres
    environment:
      POSTGRES_DB: helixcode_prod
      POSTGRES_USER: helix
      # CONST-042: supplied at runtime from the private configuration source.
      # infraboot exports HELIX_AUTOBOOT_PG_PASSWORD (resolved from .env via
      # internal/secrets) before invoking compose, so both sides always agree.
      POSTGRES_PASSWORD: ${HELIX_AUTOBOOT_PG_PASSWORD:?set HELIX_DATABASE_PASSWORD in .env (run ./setup.sh, or cp .env.example .env)}
    ports:
      - "127.0.0.1:55432:5432"
    # NAMED VOLUME (HXC-168, 2026-09-08). This service declared no volume at
    # all, so podman created an ANONYMOUS one. Recreating the container --
    # the only way podman can change a published port binding -- would have
    # ORPHANED it and started empty, silently losing live data (measured:
    # users=134, user_sessions=33). A named volume makes the container
    # recreatable without data loss (§9.2).
    volumes:
      - helixcode_autoboot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helix -d helixcode_prod"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: helixcode-autoboot-redis
    ports:
      - "56379:6379"
    # NAMED VOLUME (HXC-168, 2026-09-08). This service declared no volume at
    # all, so podman created an ANONYMOUS one. Recreating the container --
    # the only way podman can change a published port binding -- would have
    # ORPHANED it and started empty, silently losing live data (measured:
    # users=134, user_sessions=33). A named volume makes the container
    # recreatable without data loss (§9.2).
    volumes:
      - helixcode_autoboot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

# Named volumes. Declared so postgres data survives a container recreate;
# see the HXC-168 note on the postgres service above.
volumes:
  helixcode_autoboot_pgdata:

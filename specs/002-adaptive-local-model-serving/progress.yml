  - id: HXA-npm-1-resolved
    title: 27 of 92 npm packages in shipped configs did not exist, and a whole scope was fictional
    detail: |
      Far larger than the single sqlite case that surfaced it. Every npx package
      name in every JSON in the config tree was run through the registry:
      27 OF 92 DO NOT EXIST. The instrument is proven — 65 resolved, so the 404s
      are real answers.
        * THE ENTIRE @anthropic-ai/mcp-server-* SCOPE IS FICTIONAL — 17 of 17
          return 404. The official scope is @modelcontextprotocol/. That is the
          whole MCP block of generated/crush/crush.json.
        * four more under the official scope 404 (server-sqlite, server-docker,
          server-linear, server-sentry);
        * five invented bare names (mcp-server-{asana,atlassian,datadog,
          google-drive,mongodb}).
      THE ROOT IS A CATEGORY ERROR worth remembering: the official sqlite MCP
      server is a PYTHON package on PyPI, invoked `uvx mcp-server-sqlite
      --db-path <p>`, and it is ARCHIVED. It was never published to npm under
      that scope. Someone took the Python/uvx invocation and pasted its
      --db-path flag into an npx call under a scope that does not exist. The
      Node equivalent takes the path POSITIONALLY — so both the name and the
      argument list were wrong, exactly as predicted, and a name-only
      substitution would have produced a differently-broken config.
      Every replacement was confirmed with real registry metadata; no name
      guessed; nothing needed removing. One honest provenance caveat recorded by
      the agent: for atlassian it used npm mcp-atlassian v2.1.0, a DIFFERENT
      project from the Python sooperset/mcp-atlassian the awesome-list cites —
      a substitution, not the upstream, and it said so.
      THE GENERATOR IS THE REAL SOURCE: generate-all-configs.sh emits the
      generated/ tree from inline heredocs, so the heredocs were fixed and the
      tree REGENERATED by running the generator rather than hand-edited.
      THE TEST'S OWN GAP was the reason this survived: it checked a
      HAND-MAINTAINED list of 14 names, missing 78 shipped packages, and
      asserted that @modelcontextprotocol/server-sqlite EXISTS — enshrining the
      defect. It now DERIVES the list from the configs, with a control probe
      that distinguishes a missing package from an unreachable registry (SKIP,
      not a false FAIL).
    severity: HIGH
    status: fixed + guarded

  - id: OPEN-31

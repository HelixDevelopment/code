  - id: SECURITY-2-3-4-resolved
    title: attestation proof was not bound to who answered; now channel-bound and address-pinned
    detail: |
      Two rounds, both reproduced before fixing.
      ROUND 1 (3efc367). Proof was HMAC(secret, nonce) — it answered "do you hold
      the secret" and said NOTHING about who answered. Any host able to reach a
      genuine instance could obtain a real answer to OUR OWN nonce and present it
      as its own, by redirecting us to one or by proxying our challenge to one.
      Both reproduced with the user's prompt, an opened file's contents, and the
      upstream credential arriving at a hostile host.
      FIX: HMAC(secret, nonce || 0x00 || audience) where the audience is the
      SOCKET ADDRESS and is NEVER TRANSMITTED — the responder signs its own
      accepted-connection LocalAddr, the client checks its own RemoteAddr. Two
      ends of one socket, so an honest direct instance agrees by construction.
      That is what defeats the proxy specifically: it may forward every byte we
      send and still cannot make an honest instance sign an address that is not
      its own. A Host-header-derived audience would NOT have covered a
      transparent byte-forwarding TCP relay; this does.
      Redirects are refused outright during attestation — the party answering the
      challenge must be the party we send content to.
      ROUND 2 (6e278e8). The binding was established on the PROBE's connection;
      Send opened a new one and re-resolved the name, so a name pointing at the
      attested instance during the probe and elsewhere at send time was not
      caught. Reproduced: all three canaries at a host that never held the secret.
      FIX: Instance.VerifiedAddr carries the verified peer forward (following
      PeerLoopback's precedent) and Send dials it through a client copy with a
      fixed DialContext, so the URL keeps its scheme/host/path and the Host
      header and TLS SNI still use the configured name.
      Two silent bypasses of a fixed dialler are REFUSED rather than ignored: a
      transport with DialTLSContext (never calls DialContext, so https would
      re-resolve) and a proxy that actually applies (the proxy picks the peer).
      An Instance with no verified address is refused BEFORE the body is
      marshalled — a silent fallback to re-resolution IS the hole, and it would
      look like it worked.
      ALSO FIXED en route: the local-host attestation exemption was granted on
      which CONFIG LIST an endpoint appeared in, not on whether the address was
      really loopback. A LAN address in LocalHostEndpoints turned the requirement
      off for that host. Now decided from the actually-connected peer, with a
      pre-dial filter so a host we could never authenticate does not even learn
      we are looking.
    severity: CRITICAL
    status: fixed + guarded

  - id: OPEN-20
    title: pinning is per-Instance, so a re-addressed instance needs a fresh Discover
    detail: |
      Behaviour change from the Send pinning fix, flagged by the agent rather
      than buried: an instance that legitimately changes address (DHCP lease,
      container restart) will not be reached by Send until it is discovered
      again. That is the correct trade — the alternative is re-resolution, which
      is the hole — but operators should know.
      Also noted: Send has no redirect policy of its own the way attestation
      does. Not a hole (the body already reached the pinned peer, and the
      redirect is dialled through the same pinned transport), but asymmetric.
    severity: LOW
    status: recorded — behaviour change, not a defect

  - id: FR-017-018-resolved
    title: the HelixCode and OpenCode exporters had no caller at all
    detail: |
      CONFIRMED. ExportHelixCode, ExportOpenCode and the Merge* functions were
      defined, unit-tested, and referenced by NOTHING outside internal/naming.
      The only non-Go references were two snippets in docs/guides that tell a
      user to import internal/naming — not importable from outside the module.
      So the artifacts were genuinely unobtainable by any user, and the
      requirement that users can obtain their configuration on demand was met
      only for the Claude Toolkit.
      GIT HISTORY CHECKED FIRST per 11.4.124: `git log -S` across all history
      shows they arrived in 1b66afb WITH their unit tests and no caller was ever
      added. Never-completed wiring, not wiring that rotted — so completing it
      was right, and removing it would have been wrong.
      FIXED: served from the same gateway the toolkit already reads models from
      — GET /v1/config/{helixcode,opencode} and POST /v1/config/{consumer}/merge
      (body in, merged content back, never writes to disk). The base URL handed
      out is the address the request arrived on, upgraded on X-Forwarded-Proto
      and never downgraded. Multiple serving hosts produce a 400 naming them
      rather than a silent pick.
      The test drives the real gin router end to end — testing the exporter
      function in isolation is what proved nothing about reachability.
    severity: HIGH
    status: fixed + guarded

  - id: SC-015-resolved
    title: the published identity named 127.0.0.1, so it named no machine and collided across machines
    detail: |
      CONFIRMED, with one sub-claim REFUTED.
      ServingHost() returned the base URL's hostname, and the embedded
      llama-server path forces 127.0.0.1 — the normal case. So the identity was
      helixllm/127.0.0.1/<model>: it names no machine, and it is IDENTICAL on
      every machine. The collapse is real and was verified in the toolkit
      source: claude-providers.sh does `group_by(.provider_id) | map(.[0])`
      over MULTIPLE enumerated hosts, so the second host is silently dropped.
      Captured RED on the pre-fix tree:
        ServingHost() for http://127.0.0.1:8080 = "127.0.0.1", want "anton"
        127.0.0.1 derives helixllm-127-0-0-1-llama3-41cc1e4fdbc7
        localhost derives helixllm-localhost-llama3-9235d4f540fa
      REFUTED sub-claim: "OpenAI-compatible local backends get no identity and
      are silently dropped." The filter is real but DELIBERATE — in this codebase
      the OpenAI-compat path serves only remote vendors, and stamping identities
      on proxied vendor models is what the design explicitly forbids. Left alone.
      FIXED: loopback and wildcard hosts resolve to os.Hostname(); a base URL
      already naming a real machine is untouched; a machine that cannot say what
      it is called yields the URL host rather than a fabricated name.
      COST STATED PLAINLY: every identifier for a locally served model changes
      ONCE. Judged worth paying because those names were wrong (they pointed at
      no machine and collided), it is the LAST re-mint of this class (both
      loopback spellings now converge, where flipping the env var used to re-mint
      silently and repeatedly), and the naming SCHEME is untouched — the golden
      file pinning it needed no change.
    severity: HIGH
    status: fixed + guarded

  - id: CHALLENGES-triage
    title: all 83 challenge failures classified; 5 fixed; none converted to skips
    detail: |
      Measured 20 passed / 83 failed / 28 skipped — the remembered 83 is right.
      The 28 skips are honest (benchmark/chaos steps with no executor, already

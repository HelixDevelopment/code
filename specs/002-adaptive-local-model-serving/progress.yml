      DISPATCHED.
    severity: HIGH
    status: "closed - see OPEN-31-resolved (previously - open — dispatched)"

  - id: HXA-testpath-1-resolved
    title: the spec-kit tests now resolve by marker, and a second failure was hiding behind the first
    detail: |
      Resolution is by MARKER rather than by counting ../: walk up for a
      .gitmodules that DECLARES the submodule, matching the whole `path =` value
      so a sibling like cli_agents/spec-kit-extras cannot satisfy it.
      Why the old lookup failed quietly: helix_agent has its OWN cli_agents/
      directory (analysis docs, no spec-kit), so the bare relative path landed
      somewhere plausible and empty rather than obviously nowhere.
      STANDALONE CHECKOUT PROVEN, not asserted: the agent compiled the test
      binary and ran it from /tmp with no .gitmodules in any ancestor, and got
      SKIP with a message naming what is absent and where it was expected.
      A SECOND, INDEPENDENT FAILURE was hiding behind the path bug: the test
      hardcoded git@github.com:github/spec-kit.git, but the meta-repo pins
      git@github.com:vasic-digital/caf-spec-kit.git — the org's own fork,
      consistent with the whole cli_agents/caf-* family. The test would have
      stayed red after the path fix. Reconciled to read the URL declared for
      THAT submodule path rather than grepping the whole file, which any
      unrelated entry could have satisfied.
      MY READING on the flagged question: pinning the org's fork is plainly
      deliberate — the caf-* naming is the org's convention for its CLI-agent
      forks — so reading the URL from .gitmodules is right and the hardcoded
      upstream was the error.
      AND A LATENT BUG THE OLD CODE WAS MASKING: removing the process-global
      os.Chdir exposed TestGitHubSpecKitAgentRegistry, which reads a
      HELIX_AGENT path, not a meta-repo one. It is now anchored separately.
      A chdir that makes several tests pass by accident is its own hazard.
      Breadth checked: one file, not a pattern. submodule_sync_test.go looks
      similar but enumerates helix_agent's own .gitmodules dynamically and is
      correct as written.
    severity: MEDIUM
    status: fixed + guarded

  - id: T055-ROUND3-NOGO
    title: round 3 is NO-GO — two new findings, and one refutes a premise I endorsed
    detail: |
      All five round-2 items HOLD, verified. Both new findings sit exactly in
      the seams the brief asked the reviewer to attack, which is the argument
      for asking specifically rather than asking generally.
      F-1 (MEDIUM) — THE RETIRED 404 FIRES FOR IDENTIFIERS A DEPLOYMENT IS
      PUBLISHING RIGHT NOW, and the premise it rests on is false twice over:
        * llamacpp.go:84-87 returns the LOOPBACK LITERAL VERBATIM when
          thisMachineName() is "" — which happens whenever os.Hostname() is
          `localhost` or `localhost.localdomain`, the DEFAULT ON MANY VMs AND
          LIVE IMAGES. With the embedded server forcing 127.0.0.1, such a
          machine publishes helixllm-127-0-0-1-… live. That also re-opens the
          two-hosts-collide defect f63b96f fixed, on that class of machine.
        * namesNoMachine accepts localhost.lan, localhost-2 and
          localhost.<anything>, which sanitise into the retired prefix.
      Reproduced across five hosts for the SAME event (model unlisted, provider
      up, host unchanged): 127.0.0.1 / localhost / localhost.lan /
      localhost.localdomain all give 404 with the message "the serving host was
      renamed" — FALSE — while gpu-01 gives 503. The same event maps to a
      permanent or a temporary answer depending only on the machine's hostname.
      The route test's only near-miss case was `localhosting`, which is why it
      survived.
      MY PART IN THIS: I recommended the bounded-set approach to the operator on
      the argument that the retired renderings are "an exactly identifiable set
      the server knows it used to publish and no longer does". The second half
      of that is what is false. I took derive.go's stated premise as established
      rather than checking whether ServingHost could still emit those hosts —
      the same class of error as SELF-12 and OPEN-15, and the third time this
      programme has been bitten by a premise asserted in a comment.
      THE REAL REPAIR is the reviewer's first step: make ServingHost never
      return a loopback literal, so the premise is true BY CONSTRUCTION rather
      than by assertion. The registry-aware check is the belt to that braces.
      F-2 (MEDIUM) — THE TOOLKIT GUARD CAN BE DELETED AND ITS OWN REPO NOTICES
      NOTHING. _CMA_HELIXLLM_SERVING_JQ does two jobs (what gets exported, and
      which hosts count as serving for the retirement gate), and NO test in that
      repo exercises it against a withheld entry. The reviewer removed the
      availability clause on a throwaway copy and the suite returned 71 passed,
      0 failed. With it gone, withheld entries — which now carry
      model_identity — are exported as usable AND count as serving evidence, so
      the data-loss gate reopens through the front door.
      The only assertion on that filter is a COPIED LITERAL in the other repo
      (withheld_models_route_test.go:170). A copy in another repository is not a
      test of the script; it is a second statement of the same fact that drifts
      silently. Third time this programme has met that shape — after the two
      precision lists and the two withheld vocabularies.
      Both dispatched.
    severity: HIGH
    status: "closed - see F-1-resolved and F-2-resolved (previously - NO-GO — both fixes dispatched)"

  - id: NOTE-6
    title: what round 3 confirms about iterating to GO
    detail: |
      Round 1 found 7. Round 2 found 4, THREE OF THEM CREATED BY ROUND 1'S
      FIXES. Round 3 found 2, both new, neither a regression of round 2.
      The count is falling and the character is changing — round 2's were
      consequences of fixes, round 3's are premises that were never checked.
      That is what §11.4.134's iterate-to-a-clean-GO is for, and it would have
      been easy to stop after round 2 with "all findings addressed", which was
      true and would have shipped a 404 that fires for live identifiers.
      Also worth recording: the reviewer verified all five round-2 items rather
      than assuming its own prior findings were fixed, and it separated [run]
      from [read] for every claim.
    severity: INFO
    status: recorded

  - id: F-1-resolved
    title: the retired-404 premise is now true by construction, not by assertion
    detail: |
      Reproduced the five-host table independently before fixing, and confirmed
      both halves of the false premise directly.
      THE PRIMARY REPAIR: ServingHost's `return host` became `return ""`. The
      provider then publishes un-prefixed, exactly as it already does for an
      unparseable base URL and as every remote provider does. That makes
      derive.go's premise true BY CONSTRUCTION. The agent also rewrote that
      comment to say so AND to record that it had previously been an assertion —
      which is the right thing to leave behind, since an asserted premise is how
      this happened.
      WHY IT SURVIVED, and this is worth keeping: the pre-existing
      loopback_serving_host_test.go SKIPS precisely on machines called
      `localhost`. The test skipped exactly the case it existed to check. Add it
      to the PATTERN-1 family — a skip that lands on the interesting case is
      indistinguishable from a pass until someone asks what it skipped.
      The agent added a `machineName` seam because the branch is otherwise
      unreachable without renaming the host (`unshare -Uru` is denied here), and
      captured the RED baseline against unchanged behaviour first.
      IT DECLINED TO WIDEN namesNoMachine, correctly: localhost.lan and
      localhost-2 name real, distinct machines, and blanking them would lose a
      genuine host. Their collision is a retired-PREFIX ambiguity, which is the
      registry step's job.
      IT IMPROVED ON THE REVIEWER'S PLAN, which I had passed through unchanged.
      The reviewer said "no live identity has a sanitised host BEGINNING WITH
      the retired rendering". On a box now called localhost.lan that predicate
      would make a pre-rename helixllm-localhost-… NON-retired too, losing the
      round-2 404. Matching the live host's FULL prefix keeps
      helixllm-localhost-lan-… live AND helixllm-localhost-… retired. Both
      asserted.
      AND IT MEASURED THE OPEN QUESTION RATHER THAN REASONING ABOUT IT. Asked
      whether the chained-older-instance case was covered, it probed: cached
      list -> 503 (covered), but EMPTY list -> still 404. The registry-aware fix
      covered it only partly, because the live-host set was built from
      registered IDENTITIES (one per model) while the question is about the
      HOST. It fixed that rather than justifying it (Registry.NoteLiveHost), and
      noted the same residual hits any local runtime between start-up and first
      model load.
      Six mutations, each diff-verified. RED polarity re-confirmed after
      `go clean -testcache`. 53 packages ok, zero FAIL.
    severity: HIGH
    status: fixed + guarded

  - id: NOTE-7
    title: a skip that lands on the interesting case
    detail: |
      loopback_serving_host_test.go SKIPS when the machine running it is called
      `localhost` — which is the exact condition under which the defect it was
      written to catch occurs.
      It is not a fail-open skip in the usual sense: it names its reason and it
      is honest about not running. But its reason and the defect's precondition
      are the same fact, so the test could never see the bug, and a green suite
      never showed a gap.
      Worth carrying as a check on future skips: when you write one, ask whether
      its condition is correlated with the failure you are guarding against. If
      it is, the skip is not a neutral absence of information — it is a blind
      spot aimed at the target.
    severity: INFO
    status: recorded

  - id: F-2-resolved
    title: the toolkit guard is now testable at home, and the drift is stated rather than hidden
    detail: |
      The agent VERIFIED the reviewer's claim rather than assuming it: on a
      throwaway copy, baseline 71 passed / 0 failed, then removed the
      availability clause (diff-verified) and got 71 passed / 0 failed —
      byte-identical. Every pre-existing case exercised only the model_identity
      clause, so nothing in that repo could tell the two versions apart.
      FIXED with a fixture carrying availability:"withheld" and three assertion
      groups, including the one that matters most: a SERVING SIBLING on the same
      host is still exported and can still license retirement — so "it passed
      because the filter rejects everything" cannot satisfy the suite. Two
      mutations: deleting the clause fails 12, rejecting everything fails 34
      including the selectivity control.
      THE TEST NOW READS THE FILTER OUT OF THE SCRIPT AT RUN TIME rather than
      restating it, so the local assertion cannot drift from the local
      definition, and renaming the variable fails loudly instead of vacuously.
      IT DECLINED TO REACH INTO THE SIBLING CHECKOUT, with the right reason: a
      cross-repo assertion would hardcode another project's path AND would
      SKIP wherever that checkout is absent — "a guard that vanishes when absent
      is the same class of problem as the one being fixed". That is the same
      lesson as NOTE-7, arrived at independently an hour later.
      I CLOSED THE REMAINING THREAD ON THE HELIX_LLM SIDE by changing what that
      test asserts. Its copied filter is now explicitly a SNAPSHOT that states
      what it cannot prove, and the load-bearing assertion became the invariant
      the PRODUCER controls: a withheld entry must carry an EXPLICIT
      availability, never an absent one. Every consumer filter defaults absent
      to serving, so omitting the marker is not a weaker signal — it is the
      OPPOSITE signal. Mutation: stamping "" fails the new invariant AND makes
      the toolkit filter SELECT the withheld model. Three assertions fall
      together.
    severity: HIGH
    status: fixed + guarded

  - id: SELF-16
    title: a restore that applied, followed by a test that reported the mutated result
    detail: |
      During the mutation above: I restored brain.go, `diff` confirmed it
      byte-identical, and the immediately-following `go test -count=1` reported
      FAIL. Re-running after `go clean -testcache` gave ok.
      So the restore HAD applied and the test still reported the pre-restore
      outcome. This is the INVERSE of the hazard already recorded as SELF-3 (a
      mutation that silently fails to apply and reports "ok"), and it is just as
      misleading in the other direction: it would send someone hunting a fix
      that was never broken.
      `-count=1` disables the result cache but does not settle this; the F-1
      agent independently hit it and used `go clean -testcache` before trusting
      its RED-polarity check.
      PRACTICAL RULE for the paired-mutation discipline everyone here is using:
      `diff` proves the FILE changed. It does not prove the TEST BINARY did. On
      restore, clean the test cache before believing a PASS or a FAIL.
    severity: MEDIUM
    status: recorded — method note

  - id: OPEN-31-resolved
    title: 113 broken package sites in Go source, not the ~55 reported
    detail: |
      The sibling's report gave ~55 sites in six files. A go/ast scan found 113
      in SEVEN, and the two it missed are instructive:
        * five more in internal/config/agent_configs.go, hidden behind a shape a
          `"npx","-y","<pkg>"` text scan cannot see — Command: "npx" and
          Args: []string{...} are SEPARATE STRUCT FIELDS. That shape is exactly
          why the new guard parses the AST rather than grepping.
        * one in challenges/codebase/go_files/kilocode_generator/, not in the
          report at all.
      47 of 123 distinct names 404'd, control-probed (npm and
      @modelcontextprotocol/server-filesystem resolved 200, so the 404s are
      answers). 3 were deliberate test fixtures; 44 production.
      EACH REPLACEMENT VERIFIED AGAINST THE REGISTRY *AND* ITS CLAIMED UPSTREAM
      REPO, on the principle that name similarity is not provenance. Linear
      looked salvageable — linear-mcp-server claims repo
      modelcontextprotocol/linear-server — but that repo is 404, so the claim is
      unverifiable and the entry was removed rather than trusted.
      35 NAMES REMOVED RATHER THAN GUESSED. Community packages exist for many,
      and the agent declined to use them: "making a stranger's package a shipped
      default is a supply-chain decision, not a name fix". Flagged, not made.
      GENERATORS AND CONFIGS DID DISAGREE, and nothing compared them: the JSON
      said `mcp-server-sqlite-npx <path>` while the generator said
      `@modelcontextprotocol/server-sqlite --db-path <path>` — which config a
      user got depended on HOW THEY GENERATED IT. The new test compares FULL
      ARGV, so a right name with a wrong flag still fails, and it refuses to
      pass if zero servers overlapped.
      GATE RECONCILIATION WITH THE BEST OBSERVATION OF THE DAY: an assertion
      `len >= 30` was replaced with distinctness and well-formedness checks,
      because A SIZE FLOOR IS SATISFIABLE BY ADDING FICTIONAL ENTRIES — which is
      exactly how these got in. The guard was rewarding the defect.
    severity: HIGH
    status: fixed + guarded

  - id: SECURITY-6
    title: four config entries point at npm security-holding packages
    detail: |
      Found by the agent and VERIFIED INDEPENDENTLY by me against the live
      registry:
        mcp-server-figma      0.0.1-security  "security holding package"
        mcp-server-postgres   0.0.1-security  "security holding package"
        mcp-server-redis      0.0.1-security  "security holding package"
        mcp-server-supabase   0.0.1-security  "security holding package"
      Control: @modelcontextprotocol/server-everything is 2026.8.31, so the
      lookups work and these versions are real answers.
      A security-holding package is what npm publishes after SEIZING A NAME —
      typically because it was used maliciously or squatted. These names EXIST,
      so every existence check passes, and they install nothing.
      Two consequences worth separating:
        * functionally, `npx -y mcp-server-figma` gets a dead stub, so the
          integration silently does nothing;
        * historically, these are names npm had to quarantine, which is a
          different and more uncomfortable fact than "the package is missing".
      The new registry guard CANNOT see these — it checks existence, and they
      exist. A version-shape check (reject 0.0.1-security) would catch them.
      NOT FIXED — out of the dispatched scope, and recorded rather than absorbed.
      NARROWED 2026-09-03 — HALF-CLOSED, and the surviving half is the one
      that still launches. Fixed on the Go side, dated 2026-09-03, each with
      a real replacement and a written rationale:
      mcp-server-figma -> figma-developer-mcp
      (`internal/mcp/extended_packages.go:113,123`), mcp-server-postgres ->
      @modelcontextprotocol/server-postgres (`:168`), mcp-server-redis ->
      @modelcontextprotocol/server-redis (`:195`), plus guards in
      `internal/mcp/config/generator.go:182`, `generator_full.go:218,518`,
      `internal/mcp/validation/validator.go:257`,
      `internal/config/agent_configs.go:378`.
      STILL LIVE: `docker/mcp/docker-compose.mcp-full.yml` (tracked, clean,
      last touched 43a784cf 2026-04-25) still invokes
      `MCP_COMMAND=npx -y mcp-server-redis` (:208), mcp-server-supabase
      (:247) and mcp-server-figma (:1057) — three of the four
      security-holding names survive there, in the file that actually starts
      the containers.
    severity: HIGH
    status: open — narrowed; the Go catalogues are fixed but docker-compose.mcp-full.yml still launches three of the security-holding npm names

  - id: OPEN-32
    title: the hawkscan post-commit hook reported a commit from a different repository
    detail: |
      Reported by the agent: the hook announced SHA 1f97cf1 in its session,
      including once when it had committed nothing, and that SHA does not match
      its actual commit (ce9c4eb9).
      1f97cf1 is MY commit, in helix_llm. The agent was working in helix_agent.
      So the hook attributed a commit from one repository to a session working
      in another. If its scans are keyed on that SHA, they are being associated
      with the wrong change.
      Environmental rather than a defect in this feature, and not investigated
      further — recorded because a tool that mis-attributes evidence is worth
      knowing about before anyone relies on its output.
    severity: LOW
    status: open — environmental

  - id: OPEN-25-resolved
    title: the device axis now applies when the LANE binds VRAM, not when the entry flags it
    detail: |
      ESTABLISHED FIRST, with citations, rather than assumed:
      `requires_accelerator: false` means "an accelerator is not REQUIRED"
      (entry.go:343-345 — "mandatory for acceptable service, as opposed to
      merely faster"), not "this never touches a GPU". And the figures on those
      entries are RAM-SOURCED — qwen3-0.6b records '"~2 GB, usable" (CPU-only)';
      qwen3.6-35b-a3b's summary says "a no-GPU host with generous RAM serves it".
      So the flags and figures are CORRECT AS RECORDED. Neither was changed.
      THE ASYMMETRY, measured: video.yaml states its figure IS "the value
      actually passed to vrambroker.Acquire(ClassVideo)". text.yaml makes no
      such claim — grep for vrambroker/vram in it returns ZERO matches. Its
      figures are RAM figures with no VRAM counterpart anywhere.
      TRACE: recorded as host RAM -> checked by memoryAxis against
      p.MemoryAvailable (host RAM) -> spent by agentgen-boot at
      broker.Acquire(ClassAgent) against VRAM. The device axis was applied only
      `if e.RequiresAccelerator`, so for these five it never ran.
      LIVE, reproduced against the SHIPPED catalogue on a 44 GiB-RAM host with a
      4 GiB card: four entries offered beyond the card, up to 24576 MiB.
      Reachable three ordinary ways — --pin, AGENTGEN_FORBID_MODELS, or simply
      the small model's weights being absent.
      THE CATCH WORTH KEEPING: one of those figures is 19968 MiB — THE SAME
      19.5 GiB that agentgen-boot's own doc comment cites as the forensic case
      it was written to close. Its claim that the lane "cannot offer a model it
      will then refuse to start" held for exactly one of six live text entries.
      A comment describing a fix, sitting above code where the fix did not
      reach.
      SHAPE CHOSEN: the device axis applies when the LANE binds VRAM, not when
      the ENTRY flags it. Alternatives rejected with reasons — flipping flags
      would contradict the catalogue's own sourced provenance, and splitting the
      schema into RAM and VRAM figures needs measurements that exist nowhere in
      the research corpus and could not be taken here. No figure invented.
      HONEST BOUNDARY, in the code and under test: on a host where NO
      accelerator was measured the answer is unchanged. Selection has nothing to
      check and will not invent a refusal; the broker's fail-closed path stands
      there instead.
      54 packages ok — the delta from 53 is exactly internal/laneboot, which had
      no test files before, verified by diffing the two ok-lists.
    severity: MEDIUM
    status: fixed + guarded

  - id: OPEN-33
    title: the vision lane has the same RAM-vs-VRAM question, unexamined
    detail: |
      vision_image.yaml carries five requires_accelerator: false entries whose
      figures were NOT re-examined for whether they are RAM- or VRAM-sourced.
      The selection fix reaches them automatically through laneboot, so they can
      no longer be offered beyond the card — but whether their recorded numbers
      mean what text.yaml's mean is a separate question, and the answer
      determines whether anything further is needed.
      Same class, own pass.
    severity: MEDIUM
    status: open

  - id: SELF-17
    title: this ledger's own status field was stale for 21 findings
    detail: |
      I recorded resolutions as NEW entries (CRITICAL-7-resolved, and so on)
      rather than updating the original's status. So the original kept saying
      "open" while a later entry said it was fixed, and anyone querying the
      ledger for open work got 40 items when the real number was 21.
      That is the same defect class this session has been finding everywhere
      else: a status field that stops tracking reality, a comment describing
      removed behaviour, a test asserting a fact that has moved. The ledger
      built to catch it had it.
      CORRECTED: 21 entries now point at what closed them, carrying their
      previous status forward in the text rather than discarding it. Only
      closures I could establish from this session's evidence were touched;
      OPEN-1 through OPEN-5, EX-28 and CRITICAL-2 predate my visibility and were
      left alone rather than guessed at.
      Two method notes from doing it. The first attempt wrote `(was: <old>)`
      into the status, and a colon-space inside an unquoted YAML scalar reads as
      a mapping — the whole file stopped parsing. THE GATE CAUGHT IT AND
      REVERTED, which is the discipline from SELF-13 working: this time the
      parse check was a condition on the write, not a statement before it.
    severity: MEDIUM
    status: corrected

  - id: OPEN-29-resolved
    title: the config endpoint no longer hands back an empty document that erases a user's models
    detail: |
      REPRODUCED, captured: a backend up but loading answers /health with 503, so
      it reports itself unavailable while still listing its configured models.
      The user's file went in holding two working models under our key and came
      back with `models: {}` — under a 200, with nothing in the returned
      document saying why. Their theme and their own providers survived; their
      two selectable models did not.
      AND THE REASONS WERE ALREADY THERE: `provider-unavailable`, in a sibling
      `withheld` field the merge never consulted.
      THE REVIEWER'S FRAMING WAS CORRECTED, and the correction narrowed the fix:
      "wholesale" overstates it. MergeOpenCode is ADDITIVE BY KEY at both levels
      — the operator's own providers and every other top-level field are copied
      through byte-for-byte. What it replaces totally is the entry under OUR
      key, which is enough to cause the loss but means the whole document was
      never at risk.
      CHOSE THE THIRD BEHAVIOUR: the endpoint now tells three states apart
      instead of collapsing two — serving (200, unchanged), offering models but
      able to serve none (503 naming host, count and the distinct withheld
      reasons), offering nothing at all (404, as before).
      The replacement rule had assumed withheld meant WITHDRAWN. Since withheld
      options now carry reasons, that assumption is unnecessary: an empty roster
      backed by reasons is the export declining to describe the instance, not a
      description of an instance with no models.
      REFUSED AT TWO INDEPENDENT SEAMS, because either alone leaves a way
      through — MergeOpenCode returns ErrNothingServable so no in-process caller
      can erase an entry, and both endpoints refuse before producing anything so
      a caller doing GET + jq never receives the dangerous document. M2 and M3
      prove neither seam masks the other.
      THE TOOLKIT'S PRICE IS NOT PAID HERE, and this is asserted rather than
      assumed (M4): the toolkit fix accepted permanent non-convergence as the
      cost of safety. Here the refusal fires on "has offers, can serve none" and
      never on "has nothing", so a genuinely-empty instance still merges through
      and clears whatever was stale. The withheld reasons are what make the two
      emptinesses distinguishable.
      DELIBERATELY NOT FIXED, and stated: the partial case (some servable, some
      withheld) still replaces, so a user can temporarily lose options that have
      not come back — a degraded entry, not an unusable one. Separating
      transient from permanent withholding needs a reason taxonomy that does not
      exist, since withheldReason passes an instance's own string through and
      the set is open.
      Vacuity guards included, so "it refuses" is not true of something that
      refuses everything.
    severity: HIGH
    status: fixed + guarded

  - id: OPEN-34
    title: a cmd/helixllm test fails intermittently in parallel runs — reported, isolated, mechanism unconfirmed
    detail: |
      TestChatCompletions_HostWithNoListedModelsIsStillLive/host_127.0.0.1
      fails intermittently under parallel full-suite runs.
      ISOLATED PROPERLY by the reporting agent rather than assumed: it
      reproduces with that agent's change entirely removed from the tree, passes
      3/3 alone and 3/3 for its own package, and does not appear under `-p 1`.
      Mechanism marked UNCONFIRMED — the provider's /health probe has a 2s
      timeout and the verdict depends on the host being seen live, which would
      make it load-sensitive.
      WORTH A SECOND LOOK RATHER THAN THE LABEL, for a specific reason: the F-1
      fix made identifier resolution registry-only with NO network on the
      request path. If this test's verdict still depends on a /health probe
      being observed, that is either a path that still probes or a test asserting
      through one — and today's LSP case is the standing reminder that "flaky"
      and "real race" are indistinguishable from the failure rate alone.
      Apply the discriminator: does the scenario contain LEGITIMATE timing? A
      live-host probe does, unlike a context cancelled before the call. So a
      genuine flake is plausible here in a way it was not there — but plausible
      is not measured.
    severity: LOW
    status: open — worth measuring before labelling
  - id: BOOT-1
    title: the ./helix facade refused to run on podman, the runtime this project mandates
    detail: |
      check_docker() required the literal `docker` binary and check_docker_compose
      required docker-compose. This host has podman + podman-compose and no docker
      at all, which is what CONST 11.4.161 and CLAUDE.md require. Every facade
      command exited 1 with "Docker is not installed or not in PATH", so the
      sanctioned boot path was dead on the sanctioned runtime.
      The script bound to a tool NAME rather than resolving the capability, and
      repeated that binding at seven call sites.
      FIXED d5158bd3 by resolving once into CONTAINER_CLI (podman preferred,
      docker still a fallback) and routing ps/exec/info through it, plus a
      matching compose resolver. ./helix status now exits 0.
    severity: HIGH
    status: fixed
  - id: BOOT-2
    title: three Dockerfiles pinned Go 1.24 while the module they build requires 1.26
    detail: |
      Dockerfile, Dockerfile.worker and Dockerfile.test copy helix_code/go.mod
      (which declares go 1.26) into a golang:1.24-alpine builder under
      GOTOOLCHAIN=local, so `go mod download` failed with
        go: go.mod requires go >= 1.26 (running go 1.24.13; GOTOOLCHAIN=local)
      docker/Dockerfile.helixqa was already on 1.26 — these three were stragglers,
      which is why the mismatch survived.
      FIXED d5158bd3.
    severity: HIGH
    status: fixed
  - id: BOOT-3
    title: a hardcoded grantee in test/init.sql aborted postgres startup in the deployment stack
    detail: |
      helix_code/test/init.sql ended with GRANT ... TO helixcode. That file is
      mounted into /docker-entrypoint-initdb.d by TWO compose files that create
      DIFFERENT roles — docker-compose.test.yml uses POSTGRES_USER helixcode,
      docker-compose.helix.yml uses helix. In the deployment stack the role does
      not exist, so init aborted and postgres exited 3 before accepting any
      connection.
      The block's own comment already said "Grant permissions to the configured
      user" — the code contradicted the comment. Same class as BOOT-1, a
      hardcoded name where the capability should be resolved.
      FIXED d5158bd3 via current_user in a DO block with %I quoting. Verified on
      a clean volume in BOTH real configurations - deployment (helix + both
      scripts) and test (helixcode + test script only) each reach Up with 0 init
      ERRORs and 15 tables. Before the fix the deployment case was Exited (3).
      NOTE postgres-init.sql hardcodes `helix` symmetrically, but it is only ever
      mounted alongside POSTGRES_USER=helix, so it is latent, not live. Left
      alone deliberately rather than widening the change.
    severity: HIGH
    status: fixed
  - id: BOOT-4
    title: the container build still cannot resolve the 43 replace directives in helix_code go.mod
    detail: |
      With BOOT-2 fixed the build gets further and then fails on
        go: dev.helix.agent (replaced by ../submodules/helix_agent) reading
            /submodules/helix_agent/go.mod - no such file or directory
      helix_code/go.mod carries 43 `replace` directives pointing at
      ../submodules/*, i.e. OUTSIDE the helix_code/ directory the Dockerfile
      copies. All 43 targets exist locally and total 4.2 GB, dominated by
      helix_qa (2.5 GB) and helix_agent (2.0 GB), most of which is vendored
      third-party trees such as signoz and chroma.
      Fixing it needs the image to mirror the repo layout plus a carefully
      scoped .dockerignore so the build context is not multi-GB. That is its own
      piece of work and was NOT attempted here.
      WORKAROUND IN USE - the native path, which Rule 4 names first
      (make build -> ./bin/<app>). The server auto-boots its own postgres and
      redis per CONST 11.4.76, so the native path needs no compose at all.
    severity: MEDIUM
    status: open — needs a scoped .dockerignore and a layout change
  - id: TEST-1
    title: the perf-scenario stability test measured one cold-cache run and called the harness noisy
    detail: |
      TestRunner_StableAcrossThreeRuns failed every full-suite run with
      CV=159% against its own 35% bound. The verdict was wrong. The test
      generates a 600-file fixture into a fresh t.TempDir() then measures
      immediately, so run 0 pays one-time filesystem cache population.
      REPRODUCED DETERMINISTICALLY - run 0 is the outlier in 3 of 3 trials,
      never runs 1 or 2, which is what distinguishes a cold cache from load
      jitter: [2079.6, 38.6, 43.0] [2114.6, 40.0, 40.6] [1989.6, 43.9, 40.6].
      Runs 1 and 2 alone give CV of 7.6%, 1.0% and 5.5% — single digits, exactly
      what the test's own comment predicts.
      FIXED 00b28c8e by discarding one real warmup RunAll. The 35% threshold was
      NOT loosened; weakening the assertion would have been the CONST 11.4.120
      forbidden fix.
      KNOWN REMAINING - the test is genuinely load-sensitive. It passed 3/3 on a
      quiet host and measured CV=37.2% while a container build had the host at
      load 28 on 16 CPUs. It wants an uncontended host, which is a property of
      timing measurement, not something to paper over.
    severity: MEDIUM
    status: fixed
  - id: TEST-2
    title: the whole tests/memory suite silently skips unless a server is already running
    detail: |
      getTestBaseURL() defaults to http://localhost:8080 and every test in
      tests/memory begins with a /health probe followed by
        t.Skip("Server not available, skipping memory leak test")
      marked SKIP-OK #legacy-untriaged. With no server up the package reports
      "ok ... 0.077s" — a green result that exercised nothing.
      MEASURED THIS SESSION - with a server running the same package took 23s
      and TestMemory_LeakDetection_ConcurrentRequests produced a rising live-heap
      signal (signed-R2 0.6565, slope 36187 B/sample, rise 51.57% of mean).
      That signal is NOT yet called a defect. It was taken on a host at load 44
      with four suites running, the absolute heap is under 1 MB, and the shape is
      flat for 7 waves then a late jump (539504 548112 555008 555936 568304
      566512 568704 653600 852112 907656), which is as consistent with HTTP
      transport idle-pool growth or GC lag under scheduling pressure as with a
      leak. It needs a clean uncontended re-run before anyone labels it.
      THE COVERAGE GAP IS THE REAL FINDING - a suite that reports ok while
      testing nothing is the CONST 11.4.238 failure mode, and it is why nobody
      had seen this signal before.
      RESOLVED ON A QUIET HOST 2026-09-03 14:00. Re-run at load ~7 with the
      server up: the test RAN and PASSED in 0.08s.
        quiet   [747112 722320 722120 739784 750480 786376 833392 872328
                 815680 801504]  signed-R2 0.6332  rise 15.48% of mean  PASS
        loaded  [539504 ... 653600 852112 907656]
                                 signed-R2 0.6565  rise 51.57% of mean  FAIL
      The verdict needs BOTH R2 >= 0.50 AND rise >= 25% of mean. On a quiet host
      the trend SHAPE survives (R2 0.63) but the MAGNITUDE collapses to 15.5%
      and the tail actually falls (872328 -> 815680 -> 801504) instead of
      climbing. So the leak signal does NOT reproduce and the 51.57% rise was a
      load artifact — GC lag and scheduling pressure at load 44, not retained
      memory. The two-part guard did exactly its job, separating trend-shaped
      noise from material growth.
      WHAT REMAINS OPEN is only the coverage gap: the suite still reports
      "ok ... 0.077s" having exercised nothing whenever no server is up, which
      is how this went unseen. The leak half is closed.
    severity: MEDIUM
    status: leak signal refuted on a quiet host; the skip-when-absent coverage gap stays open
  - id: METHOD-1
    title: running four test suites concurrently manufactured false failures in three of them
    detail: |
      Recorded as a lesson, not a product defect. Dispatching helix_llm,
      helix_code, helix_agent and claude_toolkit suites at once took the host to
      load 60 on 16 CPUs and produced three distinct false-failure modes:
        - timing: perf scenarios failed again despite the TEST-1 fix, and
          helix_llm's TestBaselineDiscardsConnectionWarmup failed because its
          inner step self-skipped on load detection ("host too loaded to measure
          concurrency ... re-run on a quieter host") while the wrapper expected
          "passed"
        - port exhaustion: helix_agent's TestAdapter_HealthCheckTCP_Success got
          "listen tcp 127.0.0.1:0 bind address already in use" — binding to port
          ZERO, i.e. ephemeral exhaustion
        - live-server interference: a running server on 8080 changed outcomes in
          BOTH directions — it woke the vacuous tests/memory suite (TEST-2) and
          it broke a challenge asserting that a CLOSED port must report SKIPPED,
          because the port was no longer closed
      This is CONST 11.4.119 (single resource owner) applied to CPU, ephemeral
      ports and localhost port space. Timing and port-binding suites need
      exclusive host ownership; a pass/fail verdict taken under self-inflicted
      contention is not evidence either way.
    severity: LOW
    status: recorded — method note
  - id: OBS-1
    title: GET /api/v1/auth/me is registered but answers 404
    detail: |
      The route appears in the router registrations scraped from
      internal/server, and register/login/refresh all work end-to-end (register
      201 with a persisted UUID, login 200 with a 287-char JWT, and that token
      opens /api/v1/tasks, /api/v1/workers and /api/v1/system/stats which are 401
      without it). But GET /api/v1/auth/me returns 404 with a valid bearer token.

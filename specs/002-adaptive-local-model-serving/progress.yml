              nomic-embed-text-v1.5:f16 where Go chooses q4_k_m — the exact
              divergence OPEN-2 described. So the test guards behaviour, not
              a string.
        2. gate memory/storage axes swapped -> FAIL: py [storage:asc first].
        3. Go memory '<' changed to '>' -> FAIL: go [memory:desc]. The
           binding is SYMMETRIC — it catches drift on either side, not only
           in the Python.
      A parser that stops recognising either side's shape calls t.Fatal
      naming what it could not read, rather than parsing nothing and
      reporting agreement.
      WHY NO RED TEST WAS AUTHORED. §11.4.115 requires a RED that reproduces
      the defect on the CURRENT artifact; this defect is already fixed, so a
      RED cannot reproduce it, and per §11.4.115's own honest boundary a RED
      that does not fail is a finding — which is this entry. Mutation 1 is
      the polarity pair: it restores the historical defect and the guard
      fails on it.

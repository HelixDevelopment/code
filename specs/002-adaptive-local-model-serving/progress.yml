  - id: SELF-12
    title: I gave an agent a false premise and it correctly refused to act on it
    detail: |
      I framed the empty-secret decision to the operator as "an empty JWT
      signing key is as dangerous as a placeholder one, arguably worse — it
      looks intentional." The operator decided on that framing. The framing was
      WRONG for helix_llm, and the agent established it rather than implementing
      what I asked.
      What it found, with citations: every credential in that codebase is
      SELF-GATING — presence IS the enable-switch and absence is a documented
      off-state (9 provider keys gated `!= ""`; empty APIKeys means open access
      by design; RedisPassword gated by RedisHost). And Auth.JWTSecret has ZERO
      consumers: no JWT import outside tests, golang-jwt not a direct dependency,
      the auth submodule replace-only and never imported. Its own configuration
      doc says "Leave empty to disable JWT auth."
      So "must be supplied" would have refused EVERY current deployment,
      including this repo's own .env.example, which ships both auth vars blank.
      That is the outage I warned it about, and my own premise was the thing
      pointing at it.
      IT IMPLEMENTED THE CORRECT RULE INSTEAD: must be non-blank ONCE SUPPLIED.
      Not vacuous — it catches a live defect. Measured: APIKeys="" -> 200,
      APIKeys="   " -> 401 on EVERY request including the correct key,
      APIKeys="real-key" -> 200. Neither open nor protected: silent total
      lockout, from a config that validated cleanly.
      It stated prominently, not buried, that HELIX_AUTH_JWT_SECRET="" still
      loads — so the operator can see their decision was narrowed and why.
      LESSON FOR ME: I wrote a brief asserting a danger I had not verified in
      that codebase, and asked the operator to decide on it. The brief should
      have said "verify this holds here first" — which, fortunately, its
      discipline section did.
    severity: MEDIUM
    status: recorded — decision was narrowed on evidence, operator should know

  - id: HXLLM-blank-credential

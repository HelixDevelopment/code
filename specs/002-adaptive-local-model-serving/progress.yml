  - id: T055-LOW-verdict
    title: the "withheld vocabularies disagree" finding is a false alarm; the real defect is adjacent
    detail: |
      REPORTED (T055, LOW): helix_llm publishes provider-unavailable /
      unnameable-model / identifier-conflict / instance-unreachable /
      model-unavailable, while helix_agent's WithheldReason.Known() accepts only
      insufficient_resources / unsupported_configuration /
      excluded_by_usage_terms — "vocabularies disagree across the wire".
      REFUTED. They are not two vocabularies for one field. They are two
      vocabularies for two DIFFERENT fields, and they never meet:
        * the five hyphenated reasons are assigned to opt.Reason on
          naming.Offer/Instance (internal/brain/naming.go, internal/naming/
          export.go) and appear in the export artifacts' comment lines.
        * api.Model.WithheldReason — the WIRE field — is NEVER ASSIGNED
          anywhere in non-test code. Zero writers.
      That is the FOURTH severity claim from this one review that did not
      survive verification.
      THE REAL FINDING, which the report pointed near but did not state:
      helix_agent READS withheld_reason off the wire (adapters/helixllm/
      types.go:167) and VALIDATES it (catalog/helixllm_source.go:71 calls
      Known()). helix_llm never writes it. The consumer is fully prepared for a
      field the producer never sends, so that validation path cannot fire and
      the withheld branch is dead code awaiting a producer.
      This is the same shape as the exporters-with-no-caller finding: declared,
      documented at length, and unreachable.
      A LANDMINE WORTH RECORDING for whoever wires it: the wire doc says
      withheld_reason is "one of the three recorded machine keys" — helix_agent's
      three. A helix_llm developer wiring this would naturally reach for the
      FIVE naming reasons already defined in that codebase, which are the wrong
      vocabulary for this field and would fail Known() on arrival. The two sets
      even use different separators (hyphen vs underscore), so a mistake here
      would look deliberate.
      NOT changed: populating or removing a documented wire field is a contract
      decision, and 11.4.124 requires investigating how it came to be unwired
      first. Recorded rather than guessed.
      VERIFIED 2026-09-03 — stale on BOTH halves, including my own
      refutation. The claim "api.Model.WithheldReason is NEVER ASSIGNED
      anywhere in non-test code, zero writers" is FALSE:
      `internal/brain/brain.go:442` does
      `m.WithheldReason = withheldReasonForWire(opt.Reason)`. And the
      landmine is closed — the two vocabularies now AGREE on five keys:
      helix_llm `pkg/api/openai.go:185,188,191,196,201` defines
      insufficient_resources / unsupported_configuration /
      excluded_by_usage_terms / provider_unavailable / identifier_conflict,
      and helix_agent `internal/catalog/option.go:98-105 Known()` accepts all
      five. The consumer's validation path can fire; the withheld branch is
      no longer dead.
    severity: LOW
    status: closed - the wire field does have a writer at brain.go 442 and the two vocabularies now agree on five keys, ledger corrected

  - id: SELF-13
    title: staging by path does not scope a commit — I swept 1424 lines of another agent's work
    detail: |
      My commit 52c827f is titled "docs(faq): the agent lane refuses models it
      used to run" and contains NINE files: my 32-line FAQ addition, and 1424
      lines of the request-validation agent's in-flight gateway work
      (requestvalidate.go, requestvalidate_test.go, upstream_error.go,
      anthropic.go, openai.go, websocket.go, i18n.go, and its design doc).
      I did NOT use `git add -A`. I staged exactly one file, by path. That was
      not enough, and this is the part worth learning:
        `git add <path>` adds to the index. `git commit` commits the ENTIRE
        index — including whatever another agent staged in the same checkout
        before I got there.
      This is SELF-8 recurring in a subtler form. After SELF-8 I adopted "stage
      explicitly by path", wrote it into the resumption file as a house rule,
      and put it in every agent brief. It is a necessary rule and I proved it is
      not a sufficient one.
      THE CORRECTED DISCIPLINE, in a shared checkout:
        * `git commit -- <paths>` (pathspec-limited) commits ONLY those paths
          regardless of what else sits in the index; or
        * inspect `git diff --cached --stat` IMMEDIATELY BEFORE committing and
          confirm it lists only your files.
      I did run that check before several other commits today. I skipped it on
      this one, and that is the whole difference.
      NOT REWRITTEN. Nothing is lost, nothing is pushed, and the agent handled
      it correctly: it declined to rewrite history and made 834971c the
      properly-titled record that says what happened. Rebasing now, with agents
      live in this checkout, would risk far more than a misleading commit title
      costs. The title is wrong; the record is complete.
    severity: MEDIUM
    status: recorded — not rewritten, deliberately

  - id: G2A-resolved
    title: malformed requests were told the server broke, and the error named the backend's address
    detail: |
      CONFIRMED and fixed. Reproduced live first: messages:[], max_tokens:-1,
      max_tokens:0+stream, role:null, and unicode/long/traversal model names all
      returned 503 with a body carrying "dial tcp 127.0.0.1:50052: connect:
      connection refused".
      ONE CORRECTION TO THE TRIAGE'S FRAMING, and it matters: 503 is WORSE than
      500 here. It tells a client to retry with backoff, and a retry of
      messages:[] can never succeed — so a correct client retries forever.
      SCOPE was larger than triaged: not two handlers and five error sites but
      THREE body-taking handlers and EIGHT error sites. /v1/agents/chat and
      /v1/agents/coordinate were found by its own review — mounted on the same
      engine, wrapping brain.Complete with %w and returning it raw. The
      WebSocket had neither redaction nor translation.
      The policy is recorded per-endpoint with citations, and the
      deliberately-NOT-validated list is as carefully argued as the validated
      one (message content, because assistant tool_calls have empty content;
      the role enum; model EXISTENCE, because that is a 404; and auth, because
      the validator never reads the Authorization header and therefore cannot
      collapse a 401 into a 400 — which keeps G2b genuinely untouched).
      Nine mutations. M9's first form left an unused import, so the package did
      not build and the test printed no failure line — the agent caught that a
      BUILD FAILURE IS NOT A PASSING GUARD and re-ran it properly. That is
      PATTERN-1 again, in yet another shape.
      MEASURED: 25/78/28 -> 34/69/28, with an exact set diff showing ZERO new
      failures. Nothing weakened, nothing skipped.
    severity: HIGH
    status: fixed + guarded

  - id: SECURITY-5
    title: the security manual documented JWT authentication that does not exist
    detail: |
      Found by running the 11.4.124 investigate-before-remove work on OPEN-22
      (Auth.JWTSecret declared and read by nothing). The field itself is minor.
      What the investigation surfaced is not.
      docs/manual/security.md had a "JWT Authentication" section telling
      operators to set HELIX_AUTH_JWT_SECRET, stating "when set, the system can
      issue and validate JWT tokens for session-based access", rating the
      variable "High — token signing key" in its severity table, and listing
      "Set a strong HELIX_AUTH_JWT_SECRET" on the PRODUCTION HARDENING
      CHECKLIST. docs/manual/modules.md made the same claim in its module table.
      There is no JWT anywhere in the server.
      THE COMBINATION IS THE DEFECT. An operator could set that secret, tick the
      checklist item, and believe the server was protected — while
      HELIX_AUTH_API_KEYS sat empty and the server was in open-access mode,
      answering anyone who could reach it. The document written to prevent that
      outcome was the thing producing it.
      VERIFIED, with the instrument sanity-checked against a module that IS
      imported (digital.vasic.containers, 12 real import sites):
        * `git log -G 'jwt\.(Parse|NewWithClaims|SigningMethod)' --all` -> 0.
          No commit in the entire history ever added a JWT library call.
        * golang-jwt does not appear in go.mod at all.
        * digital.vasic.auth is a `replace` directive at go.mod:110 with NO
          matching `require`, imported by no Go file. A replace without a
          require does nothing.
        * the only auth enforced is APIKeyAuth — a string comparison, open
          access when the key list is empty.
      FIXED at the documentation layer: the section says NOT IMPLEMENTED and
      states what authentication actually exists; the severity row now reads
      "None today"; the checklist item is STRUCK THROUGH rather than deleted, so
      an operator who followed the old list can see it was withdrawn and go
      re-check that HELIX_AUTH_API_KEYS is genuinely set.
      The config field is KEPT — removing it would break .env files that set it,
      and it is where an implementation would land.
      §11.4.124 VERDICT on OPEN-22: this is not wiring that rotted. It was never
      built. The field arrived in 48a6479 ("feat: add HelixConfig with env
      loading and validation") in a commit containing only config.go and its
      test, and no implementation ever followed. Whether to build JWT auth or
      drop the field is now an INFORMED decision rather than a blocked one.
    severity: HIGH
    status: documentation fixed; whether to implement JWT auth is an operator decision

  - id: T055-REREVIEW-NOGO
    title: the re-review is NO-GO — three of four findings were created by the fixes
    detail: |
      This is the most important result of the session, and it corrects reports
      I already gave the operator as successes.
      Every finding was CONFIRMED BY RUNNING CODE, not by reading.
      F1 (HIGH) — the identity re-mint means a user holding an OLD identifier is
        SILENTLY ANSWERED BY THE WRONG MODEL. Captured:
          stale "helixllm-127-0-0-1-qwen2-5-7b-ba85a3230a59" -> HTTP 200
            model="deepseek-chat" ... answered by chutes
            cloud received [deepseek-chat] ; local received []
        That is the original CRITICAL, reproduced exactly, for the population of
        identifiers the batch ITSELF created. PinModel misses, and the chain
        falls through to the score-ordered loop. The fix's rationale ("a caller
        who wants any available model names no model") does not describe a
        string carrying our own helixllm- prefix.
      F2 (HIGH) — --apply retirement FAILS OPEN and deletes a user's whole
        config for a host that is merely restarting. Gateway up + backend
        loading gives /health 503 -> unavailable options dropped -> /v1/models
        answers 200 with an empty data array -> the toolkit reads "answered"
        -> gate 3 retires EVERY record -> cmd_remove rm -f's the .env and alias.
        ~30 seconds after a restart is enough.
        The toolkit's own test LOCKS IT IN at line 474: "a host that answers
        with an EMPTY list still converges … its last provider is retired too".
        Note the shape: the agent that wrote that sweep articulated exactly the
        right principle — "silence is never evidence" — and then drew the line
        one state too far, reasoning an empty answer is a real answer. It is
        not, when the backend is still loading.
      F3 (MEDIUM) — the pin fix put a SYNCHRONOUS /health probe on every
        request's hot path, including cloud requests that never touch the local
        backend. Measured: a hung /health adds 2.008s to a deepseek-chat request
        that completes in 423us when healthy. The route test could not see it
        because its stub's Available() is a bool.
      F4 (MEDIUM) — a raw name served by two providers pins to the
        alphabetically-first EVEN WHEN IT IS DOWN, refusing while a serving copy
        is up. Before the batch that request was served.
      W1 (LOW) — pinned-unavailable returns 500 where the chain returns 503.
      WHAT THIS MEANS FOR ME: I reported F1's fix, F3's fix and F4's fix to the
      operator as successes. They were real fixes and they each created a new
      defect. §11.4.134's iterate-to-GO exists precisely because a first pass
      that "addressed the findings" is not the same as a batch that works, and
      this is the clearest demonstration of it in the session.
    severity: CRITICAL
    status: "closed - see F1-F4-W1-resolved, F2-resolved and WITHHELD-on-wire (previously - NO-GO — fixes dispatched for all five)"

  - id: LANEBOOT-extracted
    title: 1008 duplicated lines removed, and the extraction proved itself by interleaved binary diff
    detail: |
      The four-way byte-identical span confirmed independently before any edit
      (the agent's first digest differed only by a trailing newline, which it
      diagnosed rather than shrugged at). It also measured the duplication I had
      flagged as unmeasured: the 28-line helper block and defaultCatalogueDir
      are identical in all four; sortedKeys in two, normalise in three.
      ~1008 duplicate lines gone; the four modelchoice.go files 1977 -> 586.
      LEFT PER-LANE ON EVIDENCE, not taste: exit code 24 keeps its lane-specific
      NAME — exitNotServable and exitWeightsNotPresent mean different things —
      and the agent verified the shared span never reaches it.
      THE PROOF METHOD IS THE PART WORTH KEEPING. Package tests passing is not
      proof a lane still DECIDES the same way, so it built the pre-extraction
      binaries from a pristine worktree and diffed 12 flows per lane, 48
      comparisons, all byte-identical — with 11 of 12 flows producing DISTINCT
      output so the comparison could not be vacuous.
      Two methodology traps it hit and fixed rather than waved through:
        * the first worktree ran from /tmp (12 GiB free vs 1.19 TiB), which
          flipped a storage-bound videogen model — environmental, not
          behavioural;
        * a later comparison showed a difference after a COMMENT-ONLY edit,
          because host memory had dropped mid-session and flipped the binding
          constraint from accelerator to memory. Re-running both binaries
          INTERLEAVED under one host state gave identical output.
          For a binary that measures the live host, a stale baseline is invalid.
      THE ANTI-DRIFT GUARD FAILED AS DESIGNED: extraction moved the only
      selection.Select out of cmd/, its floor-of-4 hit zero, and it refused to
      pass vacuously. Reconciled and made STRONGER — one call site permits a
      check four copies could not state: no cmd/ file may call selection.Select
      directly, and laneboot must hold EXACTLY ONE.
      And a finding about the old guard itself: its precise-looking first
      pattern "Reserve:       runtime.SelectionReserve()," NEVER MATCHED
      ANYTHING, because gofmt writes a single space. Only its loose fallback
      ever did any work.
      Its own review found two false-negatives in its new gate, one of which its
      comment had already claimed was closed — which the agent called "a bluff
      in my own words until fixed". Both reproduced and fixed.
    severity: INFO
    status: landed

  - id: OPEN-28
    title: the toolkit baseline may have moved from 2 failures to 3 — unsettled on purpose
    detail: |
      The re-review's final suite pass measured claude_toolkit at 61 files /

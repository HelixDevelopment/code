  - id: HXA-testharness-1
    title: five integration tests need a gitignored BUILD ARTIFACT, and fail because nobody built it
    detail: |
      The re-review described helix_agent's 22 failures as "environment-bound
      and out of scope". I checked rather than inheriting that, because the same
      description was wrong for helix_llm's integration tests earlier today
      (OPEN-19 — they needed one line in the test framework, not a service).
      ESTABLISHED BY READING: bin/helixagent is gitignored (.gitignore:29), i.e.
      it is a BUILD ARTIFACT, and five integration tests require it:
        tests/integration/cli_schema_validation_test.go
        tests/integration/opencode_config_regression_test.go
        tests/integration/opencode_test.go
        tests/integration/mcp_sse_endpoint_test.go
        tests/integration/ensemble_handler_integration_test.go
      A test that fails because nobody ran `make build` first is a HARNESS gap,
      not an environment gap. The distinction matters: an environment gap is
      something the machine cannot provide, and this is something the test could
      provide for itself, or name in a SKIP, or the harness could build.
      NOT YET VERIFIED by building — a baseline run was in flight and building
      mid-run would have invalidated it, which is the stale-baseline trap the
      laneboot agent hit and diagnosed. Verify by building and re-running.
      NARROWED 2026-09-03 — the premise "nobody built it" no longer holds.
      The artifact EXISTS: `submodules/helix_agent/bin/helixagent`,
      97679552 bytes, mtime Sep 3 18:30, gitignored (`.gitignore:24
      /helixagent`), and all five named integration tests still reference it.
      The owed build-and-rerun verification STILL CANNOT COMPLETE: the module
      does not compile in the current tree because of another agent's
      in-flight edit
      (`internal/handlers/openai_compatible.go:1367` assignment mismatch,
      file uncommitted) — an external blocker, not a finding.
    severity: MEDIUM
    status: open — narrowed; the binary now exists, the build-and-rerun is blocked only by another agent's in-flight compile error

  - id: HXA-testharness-2
    title: a test reads the operator's personal config and asserts a fact about their machine
    detail: |
      tests/integration/cli_schema_validation_test.go:166,
      TestOpenCodeSchemaValidation, does:
        configPath := filepath.Join(os.Getenv("HOME"), ".config", "opencode", "opencode.json")
        data, err := os.ReadFile(configPath)
        if err != nil { t.Fatalf(...) }
      It reads the DEVELOPER'S REAL PERSONAL CONFIG and fails hard when absent.
      Three things are wrong with that, in increasing order of importance:
        * it fails on any machine where the operator has not installed and
          configured OpenCode — which is not a defect in this project;
        * a PASS asserts "this machine's OpenCode config is schema-valid", a
          fact about the operator's machine rather than about this codebase.
          The test's subject is wrong, so neither outcome says anything about
          the code under test;
        * it reads whatever the operator has in that file.
      The surrounding table (agentConfigs()) builds ConfigPath under homeDir for
      several third-party CLI agents, so the file's intent looks like "validate
      the installed agents' configs". If that is the intent, the absence of an
      optional third-party tool must be a SKIP naming what is missing, never a
      Fatalf. If instead it is meant to validate a config THIS project
      generates, it should generate one into a temp dir and validate that.
      Either reading makes the current form wrong.
    severity: MEDIUM
    status: open — needs a decision on which of the two it is meant to be

  - id: HXA-npm-1
    title: generated user configs reference two npm packages that do not exist
    detail: |
      Found by running down TestMCPPackageExistence, one of the helix_agent
      failures described as "environment-bound and out of scope".
      This project writes THREE DIFFERENT sqlite MCP package names into configs
      across four files. Verified against the live npm registry, with the
      instrument sanity-checked (the third lookup RESOLVED, so the two 404s are
      real answers and not a network failure):
        @modelcontextprotocol/server-sqlite   DOES NOT EXIST
          scripts/cli-agents/configs/generated/opencode/opencode.json:45
          scripts/cli-agents/configs/opencode.template.json:66   <-- the TEMPLATE
        @anthropic-ai/mcp-server-sqlite       DOES NOT EXIST
          scripts/cli-agents/configs/generated/crush/crush.json:40
        mcp-server-sqlite-npx                 exists, 0.8.0
          configs/cli-agents/crush.json:128
      A user who takes the generated opencode or crush config gets an MCP server
      that fails to start on an npm 404. And because the TEMPLATE carries a
      non-existent name, every future generation is wrong too.
      NOT FIXED BY ME, deliberately. The substitution is not a rename: the
      working package takes different arguments (`["-y",
      "mcp-server-sqlite-npx"]` with no --db-path, versus `["-y", "<pkg>",
      "--db-path", "..."]`). Choosing the package and its invocation needs
      research into what these servers actually are, and guessing it is how
      SELF-7 happened.

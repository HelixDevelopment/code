  - id: ROOT-2
    title: helixagent discovers zero providers because 33 of 34 matching key vars are absent from its environment
    detail: |
      The second half of why nothing is usable. helixagent returns
        503 {"type":"no_provider_available",
             "message":"All providers failed: no provider in the chain was able
                        to handle the request"}
      and its startup pipeline logs "Discovered providers count=0 / Verified
      providers verified=0" after checking 44 candidates.
      I first recorded this (BOOT-7) as "the operator's keys live somewhere
      helixagent does not look", implying a NAME mismatch. That was wrong, and
      the correction matters because it changes the fix from "teach it new
      names" to "give it the file".
      MEASURED deterministically (LC_ALL=C; the default locale's collation
      silently mis-sorted the first attempt and comm warned about it — worth
      remembering, an unsorted comm quietly produces a wrong intersection):
        helixagent scans      137 candidate provider env-var names
                              (impl: internal/verifier/startup.go)
        operator keys file has 46 key vars
        INTERSECTION          34
        present in the running helixagent process env:  1
        ABSENT:                                        33
      So the names ALREADY AGREE. helixagent looks for exactly what the
      operator has. The 33 absent ones include DEEPSEEK_API_KEY, GROQ_API_KEY,
      MISTRAL_API_KEY, OPENROUTER_API_KEY, NVIDIA_API_KEY, HUGGINGFACE_API_KEY,
      GEMINI_API_KEY, CHUTES_API_KEY, CEREBRAS_API_KEY, FIREWORKS_API_KEY,
      KIMI_API_KEY, ZAI_API_KEY — and the Claude Toolkit independently verifies
      providers backed by those same keys as working, so they are live.
      CAUSE IS MINE: I started helixagent by hand with only the .env I had just
      created for it (JWT_SECRET). The provider keys live in the keys file the
      toolkit reads ($HOME/api_keys.sh by default, CMA_KEYS_FILE overridable),
      and helixagent never saw it.
      FIX: the helixagent unit needs BOTH env sources. Routed to the systemd
      stream, with the caution that systemd EnvironmentFile parses KEY=value
      only and does NOT execute shell — if the keys file uses `export` or any
      interpolation, it must be sourced via an ExecStart wrapper or converted,
      not pointed at naively.
      WHY IT MATTERS BEYOND helixagent: the toolkit can only mark a provider
      `verified` once something genuinely completes a request. ROOT-1 fixes
      "cannot connect"; this fixes "connected but nothing upstream to serve".
      Both are needed before the operator's `claude-providers list` shows a
      Helix entry.
      VERIFIED 2026-09-03 — the routed fix landed, and it landed the careful
      way this row asked for. `helixagent.service:118` runs
      `ExecStart=@HELIX_ROOT@/scripts/systemd/exec-with-api-keys.sh
      .../bin/helixagent` — a SOURCING WRAPPER, not a naive EnvironmentFile,
      exactly the caution recorded above (`exec-with-api-keys.sh:53`:
      `readonly KEYS_FILE="${CMA_KEYS_FILE:-${HOME}/api_keys.sh}"`). All 12
      key names this row listed as ABSENT are now present in the running
      process environment read from `/proc/315821/environ` (48 distinct
      *_KEY/*_TOKEN names in total; names only, never values). The counters
      moved with it: `Discovered providers count=32`,
      `Verified providers verified=32`.
    severity: HIGH
    status: closed - the sourcing-wrapper unit landed and all 12 named-absent keys are in the running env, ledger corrected

  - id: OPEN-3-resolved
    title: the agent lane was migrated after OPEN-3 was written; the finding was stale, not the code
    detail: |
      OPEN-3 asked for an operator decision between two options — migrate the
      lane, or fix only the compose default. The decision is MOOT: the fuller
      option was already taken. Commits 0c43b11 ("stop making an operator keep
      the model and its VRAM claim in step by hand") and abbc0d2 ("one shared
      model-selection decision, not four copies") migrated the lane, and the
      ledger was never updated. Every specific claim in OPEN-3 is now false,
      checked one at a time against the current source rather than inferred:
        "NO modelchoice.go at all"
            -> cmd/agentgen-boot/modelchoice.go exists and is tracked.
        "main.go:118 seeds AGENTGEN_MODEL_GGUF"
            -> main.go:102 declares it as `weightsKey`, a compose
               interpolation OUTPUT; main.go:234 applyChoice() OVERWRITES any
               inherited value and prints IGNORED-CONFIG naming it. The
               decision itself is main.go:181, laneboot.Decide().
        "compose.agent.yml:44 bakes Mistral-Nemo-Instruct-2407-Q4_K_M.gguf"
            -> compose.agent.yml:46 is now
               `- /models/${AGENTGEN_MODEL_GGUF}   # DECIDED — no default`.
               The only surviving occurrence of that filename in the lane is
               compose_model_default_test.go:18, where the removed default is
               QUOTED as the defect the test guards against.
      SO THE LANE IS NOT A FOURTH COPY EITHER: the decision moved into
      internal/laneboot, which all four boot lanes now call (agentgen,
      visiongen, imagegen, videogen modelchoice.go + main.go). The lane keeps
      only the half that is genuinely its own — locating a chosen build's GGUF
      (model id AND variant, so a q8 file is never admitted for a q4 decision,
      and an mmproj is never mistaken for text weights) and its own
      weights-not-present refusal, exit 24.
      EVIDENCE THAT IT SELECTS, RATHER THAN THAT A FILE EXISTS.
      `go test ./cmd/agentgen-boot/... -count=1` passes, and the run prints the
      refusals rather than merely returning ok:
        TestStaticallyNamedFileIsNeverBooted   — measured host=anton, 5 options
          WITHHELD on memory with per-option shortfalls, 1 servable, its
          weights absent -> CANNOT-CHOOSE, nothing started.
        TestDecisionOverwritesConfiguredNames  — AGENTGEN_MODEL_GGUF=
          "statically-named-model.gguf" and AGENTGEN_NEED_BYTES=99999999999
          both reported IGNORED-CONFIG and replaced by the measured choice.
        TestPinIsAConstraintNotABypass         — the pin is measured first and
          REFUSED (unsupported_configuration, remedy=different-approach).
        TestMeasurementFailureIsReportedAndRefused — unmeasured host exit 20,
          30s-old reading exit 21. No fixed default in either path.
        TestProjectorIsNeverMistakenForWeights, TestWithheldReasonsStayDistinct,
        TestEnvironmentDoesNotChangeTheDecision, TestNoFixedDefaultWhenThe
        HostCannotBeChosenFor — all PASS.
      THE GUARD IS FALSIFIABLE, PROVEN BY §1.1 PAIRED MUTATION rather than
      asserted. Re-introducing the EXACT pre-fix default from OPEN-3 into
      compose.agent.yml:46 makes all three compose-layer guards FAIL:
        TestComposeSuppliesNoModelDefault        FAIL (":-" default)
        TestComposeNamesNoModelArtefact          FAIL (names the .gguf)
        TestComposeDefaultsNothingThatSelectsAModel FAIL
      Mutation restored the same turn, tree verified clean and residue-scanned
      before any commit (§11.4.84); guards re-run GREEN on the restored file.
      WHY NO RED TEST WAS AUTHORED. §11.4.115 requires a RED that reproduces
      the defect on the CURRENT artifact. This defect is already fixed, so a
      RED cannot reproduce it — and per §11.4.115's own honest boundary, a RED
      that does not fail is a finding, which is exactly this entry. The
      standing guards landed with the fix ARE the polarity pair: their doc

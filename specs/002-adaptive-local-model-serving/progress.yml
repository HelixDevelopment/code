      llama-server (`owned_by: llamacpp`, model qwen2.5-coder-3b), NOT
      helixagent, so `helixagent.json` now points at a LIVE BUT WRONG
      service and will connect and mis-serve rather than fail loudly.
      :18435 remains genuinely dead (curl 000 on both paths). The real
      listeners this row names — 7061, 8111, 8443 — are all confirmed
      present.
      ONE SUB-CLAIM NOT REPRODUCIBLE: the corroboration "no *_verified.json
      for any of the three while 20+ other providers each have one" cannot be

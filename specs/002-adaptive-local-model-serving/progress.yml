    severity: HIGH
    status: open — narrowed; the G4 null-data listing is fixed and guarded, the remaining group counts need a re-run to re-measure
    next: G4 (smallest), then decide the G2a validation policy once for both handlers

  - id: HXA-netaddr-1
    title: an unpaired bracket in a configured host silently becomes a connection to ::1
    detail: |
      Found while accounting for uncommitted work in helix_agent. The failure is
      on COMMITTED code — proven not to be anyone's in-flight work: netaddr is
      unmodified in the tree, and `go list -deps -test` shows zero dependency
      edges to the packages that do have uncommitted changes.
      The test asserts url.Parse REFUSES the URL built from host "[[::1]".
      Probed the stdlib directly on go1.26.0:
        "http://[[::1]:6379"  PARSED  hostname="::1" port="6379"
        "http://[[::1]]:6379" REFUSED
      So Go SILENTLY DISCARDS the stray leading bracket and yields a real,
      connectable destination.
      The test's stated danger — "a mutant that makes it parse invents a
      destination" — is exactly right. Its assumption that url.Parse would catch
      it is wrong. Nothing catches it: an operator who mistypes a bracket in a
      configured host gets a silent connection to ::1 instead of an error.
      A gate that is RIGHT about the danger and WRONG about the mechanism.
    severity: HIGH
    status: "closed - see HXA-netaddr-1-resolved (previously - open — dispatched)"

  - id: SELF-11
    title: I nearly misread my own filtered output as a finding
    detail: |
      I backgrounded `go test ./internal/... | grep -E '^(FAIL|--- FAIL)'` and
      later counted '^ok' in the log. It reported "0 packages ok", which reads
      like a catastrophe. There were no ok lines because MY OWN FILTER had
      removed them.
      PATTERN-1 a fourth time, and this time against me rather than a tool:
      absence of output is ambiguous between "clean" and "you did not capture
      it". The actual result was one failing package.
    severity: LOW
    status: recorded — lesson

  - id: OPEN-17-18-resolved
    title: selection and the broker now agree on headroom; commitments charge the card they were weighed against
    detail: |
      Both reproduced with captured output before fixing.
      GAP 1: card free=11776 MiB, model needs=10240 MiB, broker headroom=2048.
        SELECTION offers: true.  BROKER admits: false.
        A user was shown a model, chose it, and met the refusal afterwards.
      GAP 2: two 16 GiB models onto one 24 GiB card — after placement 1 the
        fleet still reported 24576 MiB free, and placement 2 succeeded.
        32 GiB committed to a 24 GiB card.
      WHERE THE HEADROOM IS STATED: internal/runtime, in SelectionReserve(),
      which READS vrambroker.HeadroomBytes rather than copying it. Pure
      selection keeps no runtime import. internal/runtime/lease.go was already
      the right seam — its own doc comment describes this exact defect ("a lane
      could offer a model the broker would then refuse, and the user met that
      refusal after choosing") and it already imports both packages.
      The composition roots are PLURAL (videogen/imagegen/visiongen-boot), so
      stating it in one would leave the others disagreeing with the gate; they
      state it by calling, not by repeating.
      THE ANTI-DRIFT TEST IS NOT A HARDCODED 2 GiB — which was the trap. It
      drives BOTH real deciders (the broker's own arithmetic, and selection
      under the reserve the binaries pass) across a sweep whose points are all
      derived from HeadroomBytes, requiring agreement at every one. Change the
      constant and the fixtures move with it; leave selection uninformed and the
      answers diverge inside the band.
      DEVICE IDENTITY: fits() records the stable DeviceIdentity the offer was
      weighed against; commit() reads it off the offer rather than re-deriving,
      so the card judged able to hold the model is the card charged, and Release
      credits the same one. Per-device rather than host-wide also buys the
      honest positive: a two-card host still takes a second model the first card
      could no longer hold.
      4 paired mutations, each diff-verified — including one that charges
      Accelerators[0] instead of the recorded identity, which fails the
      order-invariance test. That is the 11.4.111 defect reintroduced and caught.
    severity: HIGH
    status: fixed + guarded

  - id: NOTE-3
    title: how a flake was ruled out properly, worth copying
    detail: |
      internal/lifecycle/TestEvict_NeverUnloadsUnderAnInFlightRequest_Concurrent
      failed once in ~6 full-suite runs during the headroom work.
      The agent did NOT assume it was unrelated — it noted that lifecycle DOES
      import vrambroker, which is exactly the dependency edge that would make it
      its own fault. It then: reproduced the failure deterministically under
      GOMAXPROCS=1; read the failing assertion (the test's own LIVENESS
      precondition, serving-refusals=0 — "the contention window never opened" —
      while the actual FR-047 correctness invariant held at 0 violations); and
      ran the same test under the same conditions in an isolated worktree at the
      commit BEFORE its own, getting an identical failure with identical
      counters. Its whole diff was 23 insertions inside a function lifecycle
      never calls.
      That is the standard: a dependency edge exists, so prove it rather than
      asserting it. The assertion is genuinely flaky under CPU starvation and
      deserves a ticket in its owning area.
    severity: INFO
    status: recorded — and lifecycle's flaky liveness assertion is worth a ticket


      `sync`. The session hook runs a sync per interactive shell, so wiring it
      would silently rewrite another tool's configuration on every new shell —
      exactly what FR-018 forbids. Export writes the catalogue and prints;
      `--apply` is a separate, explicit act. `sync` behaviour is byte-identical.

      NARROWED 2026-09-03 — the `next:` step is DONE.
      `internal/gateway/openai.go:552` now emits `Data: []api.Model{}` and is
      guarded by a dedicated test `internal/gateway/listmodels_null_data_test.go`
      ("A listing that says \"data\": null is not a listing") asserting the

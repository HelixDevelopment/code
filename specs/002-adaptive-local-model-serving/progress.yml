  - id: TOOLKIT-3
    title: helixllm-export reports a healthy host as unreachable when the cert is self-signed
    detail: |
      Two independent gotchas, both of which make a WORKING host look dead:
      (1) `_cma_helixllm_fetch_models` appends `/models` to the given base, so
          `--host https://host:8443` requests `/models` and misses `/v1/models`.
          The base must already contain `/v1`.
      (2) It fetches with a bare `curl -sf` carrying no `--cacert`. Against
          helixllm's self-signed cert that is **curl exit 60**, and the only
          user-visible message is
            "host ... did not answer with a model listing"
          which reads as "the host is down" when the host is answering fine.
      NO CODE CHANGE NEEDED - `CURL_CA_BUNDLE=<cert.pem>` makes curl verify;
      the generated cert covers localhost, 127.0.0.1 and 192.168.0.241.
      Worth considering: the message conflates "unreachable" with "reachable but
      untrusted", and distinguishing them would have saved the whole diagnosis.
      With both fixed the chain works, and correctly exports NOTHING, because
      the single catalogued model is withheld (see BOOT-8).
    severity: LOW
    status: open — works around cleanly; the misleading message is the real finding
  - id: BOOT-8

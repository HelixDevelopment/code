      `withheld / provider_unavailable`), and `.env:89` sets
      HELIX_LLM_LOCAL_MODEL=qwen2.5-coder-3b-instruct-q4_k_m.
      STILL TRUE, and the whole of what remains open: the hardcoded default
      at `submodules/helix_llm/internal/shared/config/config.go:47` is still
      `default:"Llama-3.1-70B-Instruct-Q4_K_M"` — ~40 GB on a 30 GB / 12 GB
      VRAM host. It bites only a fresh checkout with no `.env`, which is
      exactly the offer-what-cannot-start mismatch feature 002 exists to
